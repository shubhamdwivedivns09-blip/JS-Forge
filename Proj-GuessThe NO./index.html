
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <h1>Number guessing game</h1>

        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>

        <form>
            <label for="guessField">Guess a number</label>
            <input type="number" id="guessField" min="1" max="100">
            <button type="submit" id="submit" >Submit guess</button>
        </form>

        <div class="result">
            <p>Previous Guesses: <span id="guesses"></span></p>
            <p>Guesses Remaining: <span id="remaining">10</span></p>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
