<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: blueviolet; color: #ffff;">
    
</body>
<script>
    const div = document.createElement('div');
    console.log(div);
    div.className = "main";
    div.id=Math.round(Math.random()*10+1);
    div.setAttribute("title","genrated title");
    div.style.backgroundColor = "green";
    // div.innerText = "This is a div genrated by JS";
    const addText = document.createTextNode("This is a text node genrated by JS");
    div.appendChild(addText);
    document.body.appendChild(div);
    console.log(div);
</script>
</html>
